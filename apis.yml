aid: amplication
name: Amplication
description: >-
  Amplication is an open-source backend development platform that generates
  production-ready microservices — REST APIs, GraphQL endpoints, data models,
  DTOs, and supporting infrastructure code — from a domain model, embedding
  organizational best practices and standards so teams avoid repetitive backend
  coding. The project is TypeScript-based, distributed as @amplication npm
  packages and an `amp` CLI, and remains actively maintained on GitHub (16k+
  stars, v3.15.0). Originally offered a hosted product at app.amplication.com; the
  hosted service and docs subdomain have since been retired and the amplication.com
  root now redirects to overcut.ai (the founders' agentic-SDLC venture), while the
  open-source project, npm packages, and Discord community continue.
